services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: diabetes-ontology-agent:local
    container_name: dmo-api
    restart: unless-stopped
    init: true
    env_file:
      - ${DMO_ENV_FILE:-.env.docker}
    command:
      - uvicorn
      - dmo.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - ${DMO_API_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    ports:
      # 暴露给外部访问
      - "0.0.0.0:8100:8100"
    volumes:
      # 运行时直接读取服务器本地代码；更新代码后重启容器即可生效。
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
      - type: bind
        source: ./ontology
        target: /app/ontology
        read_only: true
      # ontology 整体只读，条件推演所需缓存单独放入可写 volume。
      - type: volume
        source: sandbox-cache
        target: /app/ontology/dist/.sandbox-cache
    extra_hosts:
      # 当 PostgreSQL/GraphDB 在 Docker 宿主机上时可使用此主机名。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen("http://127.0.0.1:8100/health", timeout=10));
          raise SystemExit(0 if data.get("ok") else 1)
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sandbox-cache:
